name: e2e

on:
  push:
  pull_request:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # /bin/bash: на macOS это системный bash 3.2 — тот, под который пишется скрипт
      - run: /bin/bash test/e2e.sh
